name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire selector (e.g. -Dtest=LessTest); empty runs the full suite'
        required: false
        default: ''

jobs:
  compile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-22.04, windows-latest, macos-latest ]
        java: [ '21' ]
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ matrix.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ matrix.os }}-maven-

      - name: Build with maven
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --no-transfer-progress verify ${{ inputs.test-filter }} -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn --no-transfer-progress verify
          fi

      - name: Report skipped tests
        if: always()
        shell: bash
        run: |
          grep -rh -B1 -A2 '<skipped' --include='TEST-*.xml' . | grep -oE '<testcase [^>]*>|<skipped[^>]*>|TestAbortedException: .*|AssumptionViolatedException: .*' || echo "No skipped tests reported"

      - name: Upload jline-builtins jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jline-builtins
          path: builtins/target/jline-builtins-3.25.1.jar
          if-no-files-found: error
